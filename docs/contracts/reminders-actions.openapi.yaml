openapi: 3.0.3
info:
  title: Reminders and Actions API Contract
  version: 1.0.0
  description: >
    Shared API contract defining endpoints, DTOs, and request/response payloads
    for booking reminders, messenger webhook integrations (Facebook Messenger & WhatsApp),
    and quick actions (confirmation, cancellation, rescheduling).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local Development Server

security:
  - BearerAuth: []
  - {}

paths:
  /webhooks/messenger:
    get:
      summary: Verify Messenger Webhook endpoint
      description: Verification endpoint used by Facebook Messenger / WhatsApp webhook setup challenge.
      operationId: verifyMessengerWebhook
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            example: subscribe
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification challenge response.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Invalid verification token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Handle incoming Messenger Webhook events
      description: Endpoint processing inbound events from Facebook Messenger and WhatsApp (e.g., button clicks, quick replies).
      operationId: handleMessengerWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessengerWebhookPayload'
      responses:
        '200':
          description: Webhook event acknowledged successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: EVENT_RECEIVED
        '400':
          description: Invalid webhook payload format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/whatsapp:
    get:
      summary: Verify WhatsApp Webhook
      responses:
        '200':
          description: Verified
    post:
      summary: Receive WhatsApp Webhook Event
      responses:
        '200':
          description: Event received

  /api/v1/webhooks/messenger:
    get:
      summary: Verify Messenger Webhook endpoint (API v1 alias)
      responses:
        '200':
          description: Verified
    post:
      summary: Handle incoming Messenger Webhook events (API v1 alias)
      responses:
        '200':
          description: Event received

  /bookings/{bookingId}/reschedule:
    post:
      summary: Reschedule a booking
      description: Action endpoint to reschedule a booking to a new time slot.
      operationId: rescheduleBookingCanonical
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: Booking rescheduled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RescheduleResponse'

  /api/v1/bookings/{id}/reschedule:
    post:
      summary: Reschedule a booking (API v1 alias)
      description: Action endpoint to reschedule a booking to a new time slot.
      operationId: rescheduleBooking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequestPayload'
      responses:
        '200':
          description: Booking rescheduled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponsePayload'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RescheduleRequest:
      type: object
      required:
        - bookingId
        - requestedStartTime
        - requestedEndTime
      properties:
        bookingId:
          type: string
          format: uuid
        requestedStartTime:
          type: string
          format: date-time
        requestedEndTime:
          type: string
          format: date-time
        reason:
          type: string

    RescheduleResponse:
      type: object
      required:
        - bookingId
        - status
        - startTime
        - endTime
      properties:
        bookingId:
          type: string
          format: uuid
        status:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time

    MessengerWebhookPayload:
      type: object
      required:
        - object
        - entry
      properties:
        object:
          type: string
        entry:
          type: array
          items:
            type: object

    WhatsAppWebhookPayload:
      type: object
      properties:
        object:
          type: string

    NotificationReminderRequest:
      type: object
      properties:
        bookingId:
          type: string

    ReminderActionRequest:
      type: object
      properties:
        bookingId:
          type: string

    RescheduleRequestPayload:
      type: object
      required:
        - bookingId
        - requestedSlotStart
        - requestedSlotEnd
      properties:
        bookingId:
          type: string
          format: uuid
        requestedSlotStart:
          type: string
          format: date-time
        requestedSlotEnd:
          type: string
          format: date-time
        reason:
          type: string

    CancellationRequestPayload:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        reason:
          type: string

    ConfirmationRequestPayload:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid

    ReminderNotificationPayload:
      type: object
      required:
        - bookingId
        - channel
        - recipientId
        - reminderType
      properties:
        bookingId:
          type: string
          format: uuid
        channel:
          type: string
        recipientId:
          type: string
        reminderType:
          type: string

    ReminderNotificationResult:
      type: object
      required:
        - notificationId
        - bookingId
        - status
        - sentAt
      properties:
        notificationId:
          type: string
        bookingId:
          type: string
        status:
          type: string
        sentAt:
          type: string

    BookingResponsePayload:
      type: object
      required:
        - bookingId
        - status
        - slotStart
        - slotEnd
        - updatedAt
      properties:
        bookingId:
          type: string
        status:
          type: string
        slotStart:
          type: string
        slotEnd:
          type: string
        updatedAt:
          type: string

    MessengerWebhookEvent:
      type: object
      properties:
        object:
          type: string

    WebhookEntry:
      type: object
      properties:
        id:
          type: string

    MessagingItem:
      type: object
      properties:
        sender:
          type: object

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
        message:
          type: string
        timestamp:
          type: string
