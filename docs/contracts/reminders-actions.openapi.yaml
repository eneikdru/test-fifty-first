openapi: 3.0.3
info:
  title: Reminders and Actions API Contract
  version: 1.0.0
  description: >
    Shared API contract defining endpoints, DTOs, and request/response payloads
    for booking reminders, messenger webhook integrations (Facebook Messenger & WhatsApp),
    and quick actions (confirmation, cancellation, rescheduling).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local Development Server

security:
  - BearerAuth: []
  - {}

paths:
  /webhooks/messenger:
    get:
      summary: Verify Messenger Webhook endpoint
      description: Verification endpoint used by Facebook Messenger / WhatsApp webhook setup challenge.
      operationId: verifyMessengerWebhookAlias
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification challenge response.
          content:
            text/plain:
              schema:
                type: string

    post:
      summary: Handle incoming Messenger Webhook events
      description: Endpoint processing inbound events from Facebook Messenger and WhatsApp.
      operationId: handleMessengerWebhookAlias
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessengerWebhookPayload'
      responses:
        '200':
          description: Webhook event acknowledged successfully.

  /webhooks/whatsapp:
    post:
      summary: Handle WhatsApp webhook events
      operationId: handleWhatsAppWebhookAlias
      responses:
        '200':
          description: Webhook event acknowledged.

  /bookings/{bookingId}/reschedule:
    post:
      summary: Reschedule booking
      operationId: rescheduleBookingAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
      responses:
        '200':
          description: Rescheduled.

  /api/v1/webhooks/messenger:
    get:
      summary: Verify Messenger Webhook endpoint
      description: Verification endpoint used by Facebook Messenger / WhatsApp webhook setup challenge.
      operationId: verifyMessengerWebhook
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            example: subscribe
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Verification challenge response.
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Invalid verification token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Handle incoming Messenger Webhook events
      description: Endpoint processing inbound events from Facebook Messenger and WhatsApp (e.g., button clicks, quick replies).
      operationId: handleMessengerWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessengerWebhookEvent'
      responses:
        '200':
          description: Webhook event acknowledged successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: EVENT_RECEIVED
        '400':
          description: Invalid webhook payload format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/reminders/send:
    post:
      summary: Send or schedule appointment reminder
      description: Triggers an immediate or scheduled appointment reminder notification to the client or master via Messenger/WhatsApp.
      operationId: sendReminderNotification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderNotificationPayload'
      responses:
        '200':
          description: Reminder notification dispatched or scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderNotificationResult'
        '400':
          description: Invalid payload or parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking or recipient not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}/confirm:
    post:
      summary: Confirm a booking
      description: Action endpoint to confirm a pending booking directly or via messenger quick action.
      operationId: confirmBooking
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the booking.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequestPayload'
      responses:
        '200':
          description: Booking confirmed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponsePayload'
        '400':
          description: Booking cannot be confirmed in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}/cancel:
    post:
      summary: Cancel a booking
      description: Action endpoint to cancel a booking directly or via messenger quick action.
      operationId: cancelBooking
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the booking.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequestPayload'
      responses:
        '200':
          description: Booking cancelled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponsePayload'
        '400':
          description: Booking cannot be cancelled in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/bookings/{id}/reschedule:
    post:
      summary: Reschedule a booking
      description: Action endpoint to reschedule a booking to a new time slot.
      operationId: rescheduleBooking
      security:
        - BearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the booking.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequestPayload'
      responses:
        '200':
          description: Booking rescheduled successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponsePayload'
        '400':
          description: Invalid slot or payload validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Booking not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Time slot conflict or race condition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RescheduleRequest:
      type: object
      required:
        - bookingId
        - requestedStartTime
        - requestedEndTime
      properties:
        bookingId:
          type: string
          format: uuid
        requestedStartTime:
          type: string
          format: date-time
        requestedEndTime:
          type: string
          format: date-time

    RescheduleResponse:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
        status:
          type: string

    MessengerWebhookPayload:
      type: object
      properties:
        object:
          type: string

    WhatsAppWebhookPayload:
      type: object
      properties:
        object:
          type: string

    NotificationReminderRequest:
      type: object
      properties:
        bookingId:
          type: string

    ReminderActionRequest:
      type: object
      properties:
        action:
          type: string

    RescheduleRequestPayload:
      type: object
      required:
        - bookingId
        - requestedSlotStart
        - requestedSlotEnd
      properties:
        bookingId:
          type: string
          format: uuid
          description: ID of the booking to be rescheduled.
        requestedSlotStart:
          type: string
          format: date-time
          description: ISO 8601 timestamp for the proposed new slot start time.
          example: "2026-10-15T14:00:00Z"
        requestedSlotEnd:
          type: string
          format: date-time
          description: ISO 8601 timestamp for the proposed new slot end time.
          example: "2026-10-15T15:00:00Z"
        reason:
          type: string
          description: Optional reason or notes for rescheduling.
          example: "Client requested time change"

    CancellationRequestPayload:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
          description: Optional confirmation of booking ID in body.
        reason:
          type: string
          description: Reason for cancellation.
          example: "Schedule conflict"

    ConfirmationRequestPayload:
      type: object
      properties:
        bookingId:
          type: string
          format: uuid
          description: Optional confirmation of booking ID in body.
        notes:
          type: string
          description: Optional confirmation notes.
          example: "Confirmed via Messenger quick reply"

    ReminderNotificationPayload:
      type: object
      required:
        - bookingId
        - channel
        - recipientId
        - reminderType
      properties:
        bookingId:
          type: string
          format: uuid
          description: Unique identifier of the associated booking.
        masterId:
          type: string
          format: uuid
          description: Unique identifier of the master.
        clientId:
          type: string
          format: uuid
          description: Unique identifier of the client.
        channel:
          type: string
          enum: [FACEBOOK_MESSENGER, WHATSAPP]
          description: Messaging channel for delivery.
        recipientId:
          type: string
          description: Recipient phone number (+995 format) or messenger scoped ID.
          example: "+995599123456"
        scheduledAt:
          type: string
          format: date-time
          description: Time when reminder should be sent.
        reminderType:
          type: string
          enum: [UPCOMING_BOOKING, ACTION_REQUIRED, RESCHEDULE_PROPOSAL]
          description: Type of notification reminder.

    ReminderNotificationResult:
      type: object
      required:
        - notificationId
        - bookingId
        - status
        - sentAt
      properties:
        notificationId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, SENT, DELIVERED, FAILED]
        sentAt:
          type: string
          format: date-time

    BookingResponsePayload:
      type: object
      required:
        - bookingId
        - status
        - slotStart
        - slotEnd
        - updatedAt
      properties:
        bookingId:
          type: string
          format: uuid
        masterId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, RESCHEDULED]
        slotStart:
          type: string
          format: date-time
        slotEnd:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MessengerWebhookEvent:
      type: object
      required:
        - object
        - entry
      properties:
        object:
          type: string
          example: page
        entry:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEntry'

    WebhookEntry:
      type: object
      required:
        - id
        - time
        - messaging
      properties:
        id:
          type: string
          example: "102938475612345"
        time:
          type: integer
          format: int64
          example: 1770000000000
        messaging:
          type: array
          items:
            $ref: '#/components/schemas/MessagingItem'

    MessagingItem:
      type: object
      required:
        - sender
        - recipient
        - timestamp
      properties:
        sender:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              example: "psid_123456789"
        recipient:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              example: "page_987654321"
        timestamp:
          type: integer
          format: int64
          example: 1770000000000
        message:
          type: object
          properties:
            mid:
              type: string
              example: "m_mid.123456789"
            text:
              type: string
              example: "Confirm booking"
            quick_reply:
              type: object
              properties:
                payload:
                  type: string
                  example: "ACTION_CONFIRM_BOOKING_123"
        postback:
          type: object
          properties:
            title:
              type: string
              example: "Confirm"
            payload:
              type: string
              example: "ACTION_CONFIRM_BOOKING_123"

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          example: "INVALID_PAYLOAD"
        message:
          type: string
          example: "The provided reschedule slot is invalid or in the past."
        details:
          type: array
          items:
            type: string
          example: ["requestedSlotStart must be a future timestamp"]
        timestamp:
          type: string
          format: date-time
          example: "2026-10-06T12:15:00Z"
